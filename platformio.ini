; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = dlc32max

; MKS DLC32 MAX: ESP32-S3, 8MB flash, CH340 USB-serial on UART0.
[env:dlc32max]
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
board_upload.flash_size = 8MB
board_build.flash_mode = dio
board_build.filesystem = littlefs
board_build.partitions = partitions_8mb.csv
build_flags =
	-DARDUINO_USB_CDC_ON_BOOT=0
monitor_speed = 9600
monitor_filters = esp32_exception_decoder
extra_scripts = build.py, merge_bin.py
framework = arduino

lib_deps = 
	https://github.com/tzapu/WiFiManager.git@2.0.17
	https://github.com/ESP32Async/ESPAsyncWebServer.git@^3.7.4
	https://github.com/madhephaestus/ESP32Servo.git@^3.0.9
	https://github.com/adafruit/Adafruit_SSD1306.git@^2.5.13
	waspinator/AccelStepper@^1.64
	bblanchon/ArduinoJson@^5.13.4

; Bench helper for finding which GPIOs sit behind the DLC32 MAX headers.
; pio run -e pinfinder -t upload && pio device monitor -e pinfinder
[env:pinfinder]
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
board_upload.flash_size = 8MB
board_build.flash_mode = dio
build_flags =
	-DARDUINO_USB_CDC_ON_BOOT=0
build_src_filter = -<*> +<../tools/pinfinder/>
monitor_speed = 115200
framework = arduino
